services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasparro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The API applies Alembic migrations on startup, then runs the ETL in the background.
  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kasparro}
      APP_API_KEY: ${APP_API_KEY:-testkey}
    ports:
      - "8001:8000"
    restart: always

  # `make test`: runs pytest against a throwaway kasparro_test database on the db service.
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kasparro_test
      APP_API_KEY: testkey
    command: ["pytest", "-q", "--cov", "--cov-report=term"]

volumes:
  postgres_data:
