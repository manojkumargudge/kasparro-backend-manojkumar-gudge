name: Scheduled ETL

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          COINPAPRIKA_API_KEY: ${{ secrets.COINPAPRIKA_API_KEY }}
        run: python scripts/run_etl.py
