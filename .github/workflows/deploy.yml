name: Deploy

# Publishes the runtime image to GHCR on every push to main (public, for evaluators), then
# deploys to Google Cloud when the GCP repository variables are configured. Without them the
# deploy job is skipped (not failed). Auth uses Workload Identity Federation: no JSON keys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: kasparro-backend
  SERVICE: kasparro-api
  JOB: kasparro-etl
  SCHEDULE: "0 * * * *"

jobs:
  publish:
    name: publish image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          {
            echo "### Image"
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::notice::GCP deploy skipped: repository variables are not set (see docs/DEPLOY_GCP.md)."
          fi

  deploy-gcp:
    name: deploy (Cloud Run + scheduled job)
    needs: publish
    if: vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      COINPAPRIKA_BASE_URL: ${{ vars.COINPAPRIKA_BASE_URL }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      SCHEDULER_SA: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Image reference
        id: image
        run: echo "ref=${REGION}-docker.pkg.dev/${PROJECT_ID}/kasparro/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
      - name: Secret bindings
        id: secrets
        run: |
          # Four required secrets; CoinPaprika authentication is optional.
          bindings=""
          missing=0
          for pair in DATABASE_URL=kasparro-database-url APP_API_KEY=kasparro-app-api-key \
                      APP_DEMO_API_KEY=kasparro-demo-api-key \
                      COINGECKO_API_KEY=kasparro-coingecko-api-key; do
            name="${pair#*=}"
            if gcloud secrets versions list "$name" --filter=state=ENABLED --limit=1 --format='value(name)' 2>/dev/null | grep -q .; then
              bindings="${bindings:+${bindings},}${pair}:latest"
            else
              echo "::error::Required secret ${name} has no enabled version."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          if gcloud secrets versions list kasparro-coinpaprika-api-key --filter=state=ENABLED --limit=1 --format='value(name)' 2>/dev/null | grep -q .; then
            bindings="${bindings},COINPAPRIKA_API_KEY=kasparro-coinpaprika-api-key:latest"
          else
            echo "CoinPaprika key absent; using free unauthenticated API."
          fi
          echo "bindings=${bindings}" >> "$GITHUB_OUTPUT"
          # Non-secret runtime settings shared by the service and the job.
          envs="FAIL_ON_ERROR=1"
          if [ -n "$COINPAPRIKA_BASE_URL" ]; then envs="${envs},COINPAPRIKA_BASE_URL=${COINPAPRIKA_BASE_URL}"; fi
          echo "envs=${envs}" >> "$GITHUB_OUTPUT"
      - name: Deploy API (Cloud Run service)
        run: |
          gcloud run deploy "$SERVICE" --image "${{ steps.image.outputs.ref }}" --region "$REGION" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated \
            --set-secrets "${{ steps.secrets.outputs.bindings }}" \
            --set-env-vars "${{ steps.secrets.outputs.envs }},RUN_ETL_ON_STARTUP=false" \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi --quiet
      - name: Deploy ETL (Cloud Run job)
        run: |
          gcloud run jobs deploy "$JOB" --image "${{ steps.image.outputs.ref }}" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "${{ steps.secrets.outputs.bindings }}" \
            --set-env-vars "${{ steps.secrets.outputs.envs }}" \
            --command python --args scripts/run_etl.py \
            --tasks 1 --max-retries 1 --task-timeout 900s --cpu 1 --memory 512Mi --quiet
      - name: Schedule ETL hourly (Cloud Scheduler)
        run: |
          uri="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${JOB}:run"
          args=(--location "$REGION" --schedule "$SCHEDULE" --time-zone "Etc/UTC" --uri "$uri"
                --http-method POST --oauth-service-account-email "$SCHEDULER_SA")
          if gcloud scheduler jobs describe "${JOB}-hourly" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${JOB}-hourly" "${args[@]}" --quiet
          else
            gcloud scheduler jobs create http "${JOB}-hourly" "${args[@]}" --quiet
          fi
      - name: Health check (must be HTTP 200)
        id: health
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          code=000
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "$url/health" || true)"
            echo "attempt ${attempt}: HTTP ${code}"
            [ "$code" = "200" ] && break
            sleep 10
          done
          cat /tmp/health.json; echo
          [ "$code" = "200" ] || { echo "::error::$url/health returned HTTP ${code}"; exit 1; }
          echo "### Live: ${url}/health returned 200" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: |
          url="${{ steps.health.outputs.url }}"
          key="$(gcloud secrets versions access latest --secret kasparro-app-api-key)"
          echo "::add-mask::$key"
          echo "Service URL: $url" >> "$GITHUB_STEP_SUMMARY"
          # First deploy: no ETL has run yet, so trigger one before checking ingest.
          if ! curl -fsS "$url/health" | grep -q '"success"\|"partial"'; then
            gcloud run jobs execute "$JOB" --region "$REGION" --wait
          fi
          APP_API_KEY="$key" python scripts/smoke_test.py --base-url "$url" --skip-rate-limit
