[project]
name = "kasparro-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ingestion", "schemas", "scripts", "main", "migrations", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "api", "core", "ingestion", "schemas", "scripts", "services", "migrations"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["migrations.versions.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["main", "api", "core", "ingestion", "schemas", "scripts", "services"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
