<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasparr0 ETL Dashboard</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-alt: #1b2640;
        --muted: #9ca9c3;
        --text: #edf4ff;
        --accent: #5eead4;
        --warning: #fbbf24;
        --danger: #f87171;
        --success: #34d399;
        --border: rgba(148, 163, 184, 0.2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0b1020, #0f172a);
        color: var(--text);
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px 56px; }
      .topbar {
        display: flex; justify-content: space-between; align-items: center;
        gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
      }
      .title { font-size: 1.7rem; font-weight: 700; }
      .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }
      .badge {
        background: rgba(94,234,212,0.12); color: var(--accent); border: 1px solid rgba(94,234,212,0.35);
        border-radius: 999px; padding: 8px 12px; font-size: 0.8rem; letter-spacing: 0.03em; font-weight: 700;
      }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px; margin: 24px 0 28px;
      }
      .card {
        background: rgba(18,26,43,0.9); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
        box-shadow: 0 8px 24px rgba(2,6,23,0.24);
      }
      .kpi-label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
      .kpi-value {
        font-size: clamp(1.8rem, 3vw, 2.7rem); margin-top: 12px; font-weight: 800; line-height: 1.1;
      }
      .panel {
        background: rgba(18,26,43,0.9); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      }
      .panel-header {
        display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px;
      }
      .panel-title { font-size: 1.1rem; font-weight: 700; }
      .muted { color: var(--muted); }
      .row { display: flex; gap: 16px; flex-wrap: wrap; }
      .pill {
        border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; background: rgba(148,163,184,0.06);
        color: var(--text); font-size: 0.8rem;
      }
      .status-ok { color: var(--success); }
      .status-warn { color: var(--warning); }
      .status-bad { color: var(--danger); }
      table {
        width: 100%; border-collapse: collapse; margin-top: 12px;
      }
      th, td {
        text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
      }
      th { color: var(--muted); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; }
      tbody tr:hover { background: rgba(148,163,184,0.04); }
      .empty { color: var(--muted); font-style: italic; }
      .controls {
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px;
      }
      input, select, button {
        background: rgba(15,23,42,0.9); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem;
      }
      button {
        cursor: pointer; background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; font-weight: 700;
      }
      .hidden { display: none !important; }
      .stack { display: grid; gap: 18px; }
      #toast {
        position: fixed; right: 20px; bottom: 24px; background: rgba(15,23,42,0.95); color: var(--text); border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: all 0.2s ease; pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translateY(0); }
      @media (max-width: 700px) {
        .topbar { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title">Kasparr0 ETL Dashboard</div>
          <div class="subtitle">Run comparison, anomaly detection, and source health.</div>
        </div>
        <div class="badge" id="appStatus">Checking API...</div>
      </div>

      <div class="controls" id="authControls">
        <input id="apiKey" type="password" placeholder="Enter API key" aria-label="API key" />
        <button id="loadBtn">Load dashboard</button>
      </div>

      <div class="grid">
        <div class="card">
          <div class="kpi-label">Total records</div>
          <div class="kpi-value" id="totalRecords">--</div>
        </div>
        <div class="card">
          <div class="kpi-label">Errors detected</div>
          <div class="kpi-value" id="totalErrors">--</div>
        </div>
        <div class="card">
          <div class="kpi-label">Latest source</div>
          <div class="kpi-value" id="latestSource">--</div>
        </div>
        <div class="card">
          <div class="kpi-label">Latest status</div>
          <div class="kpi-value" id="latestStatus">--</div>
        </div>
      </div>

      <div class="stack">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">ETL source health</div>
            <div class="muted" id="lastUpdated">Waiting for data...</div>
          </div>
          <div id="sourcesTableWrap"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Anomalies</div>
            <div class="muted">Recent run comparison</div>
          </div>
          <div id="anomaliesWrap"></div>
        </div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const state = {
        apiKey: localStorage.getItem('kasparro_api_key') || '',
      };

      const els = {
        apiKey: document.getElementById('apiKey'),
        loadBtn: document.getElementById('loadBtn'),
        appStatus: document.getElementById('appStatus'),
        totalRecords: document.getElementById('totalRecords'),
        totalErrors: document.getElementById('totalErrors'),
        latestSource: document.getElementById('latestSource'),
        latestStatus: document.getElementById('latestStatus'),
        lastUpdated: document.getElementById('lastUpdated'),
        sourcesTableWrap: document.getElementById('sourcesTableWrap'),
        anomaliesWrap: document.getElementById('anomaliesWrap'),
        toast: document.getElementById('toast'),
      };

      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2200);
      }

      function headerConfig() {
        const key = state.apiKey.trim();
        return key ? { 'X-API-KEY': key } : {};
      }

      function fmtDate(val) {
        if (!val) return '—';
        const d = new Date(val);
        if (Number.isNaN(d.getTime())) return val;
        return d.toLocaleString();
      }

      function statusClass(status) {
        if (status === 'success') return 'status-ok';
        if (status === 'partial' || status === 'failed') return 'status-warn';
        return 'status-bad';
      }

      function setStatus(text, tone = 'neutral') {
        els.appStatus.textContent = text;
        els.appStatus.style.color = tone === 'ok' ? '#34d399' : tone === 'warn' ? '#fbbf24' : tone === 'bad' ? '#f87171' : '#edf4ff';
        els.appStatus.style.borderColor = tone === 'ok' ? 'rgba(52,211,153,0.35)' : tone === 'warn' ? 'rgba(251,191,36,0.35)' : tone === 'bad' ? 'rgba(248,113,113,0.35)' : 'rgba(148,163,184,0.2)';
      }

      function renderSources(sources) {
        if (!Array.isArray(sources) || !sources.length) {
          els.sourcesTableWrap.innerHTML = '<div class="empty">No ETL checkpoints found yet.</div>';
          return;
        }

        const rows = sources.map((s) => {
          const status = s.status || 'unknown';
          const cls = statusClass(status);
          return `
            <tr>
              <td>${escapeHtml(s.source || 'unknown')}</td>
              <td><span class="${cls}">${escapeHtml(status)}</span></td>
              <td>${Number(s.linked || 0).toLocaleString()}</td>
              <td>${Number(s.errors || 0).toLocaleString()}</td>
              <td>${escapeHtml(s.duration_seconds != null ? `${Number(s.duration_seconds).toFixed(1)}s` : '—')}</td>
              <td>${fmtDate(s.last_run)}</td>
            </tr>
          `;
        }).join('');

        els.sourcesTableWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Source</th>
                <th>Status</th>
                <th>Linked</th>
                <th>Errors</th>
                <th>Duration</th>
                <th>Last run</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function renderAnomalies(items) {
        if (!Array.isArray(items) || !items.length) {
          els.anomaliesWrap.innerHTML = '<div class="empty">No anomalies detected in the latest run comparison.</div>';
          return;
        }

        const rows = items.map((a) => `
          <tr>
            <td>${escapeHtml(a.source || 'unknown')}</td>
            <td>${fmtDate(a.last_run)}</td>
            <td>${escapeHtml(a.anomaly || '—')}</td>
            <td>${a.linked != null ? Number(a.linked).toLocaleString() : '—'}</td>
            <td>${a.errors != null ? Number(a.errors).toLocaleString() : '—'}</td>
          </tr>
        `).join('');

        els.anomaliesWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Source</th>
                <th>Last run</th>
                <th>Anomaly</th>
                <th>Linked</th>
                <th>Errors</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function apiFetch(path) {
        const res = await fetch(path, {
          headers: headerConfig(),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `Request failed: ${res.status}`);
        }

        return res.json();
      }

      async function loadDashboard() {
        try {
          const stats = await apiFetch('/stats');
          const health = await apiFetch('/health');
          const anomalies = await apiFetch('/compare-runs');

          const etl = health?.etl || {};
          const totalRecords = stats?.total_records ?? 0;
          const totalErrors = etl?.errors_detected ?? 0;
          const latestSource = etl?.latest_source || '—';
          const latestStatus = (etl?.latest_status || 'unknown').toString();

          els.totalRecords.textContent = Number(totalRecords).toLocaleString();
          els.totalErrors.textContent = Number(totalErrors).toLocaleString();
          els.latestSource.textContent = latestSource;
          els.latestStatus.textContent = latestStatus;
          els.latestStatus.className = 'kpi-value ' + statusClass(latestStatus);
          els.lastUpdated.textContent = `Last run: ${fmtDate(etl?.latest_run_at)}`;

          renderSources(etl?.sources || []);
          renderAnomalies(anomalies?.anomalies || []);

          const statusTone = health?.status === 'ok' ? 'ok' : health?.status === 'degraded' ? 'warn' : 'bad';
          setStatus(health?.status ? `${health.status.toUpperCase()} API` : 'API STATUS', statusTone);

          localStorage.setItem('kasparro_api_key', state.apiKey);
          showToast('Dashboard loaded');
        } catch (err) {
          console.error(err);
          setStatus('AUTH REQUIRED', 'bad');
          showToast(err.message || 'Unable to load dashboard');
        }
      }

      els.apiKey.value = state.apiKey;
      els.loadBtn.addEventListener('click', () => {
        state.apiKey = els.apiKey.value;
        loadDashboard();
      });

      els.apiKey.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          state.apiKey = els.apiKey.value;
          loadDashboard();
        }
      });

      if (state.apiKey) {
        loadDashboard();
      } else {
        setStatus('AUTH REQUIRED', 'warn');
      }
    </script>
  </body>
</html>
